name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types: [created]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

permissions:
  contents: write   # Required to upload release assets

jobs:
  build:
    name: Build GeminiAgentApp.exe
    runs-on: windows-latest

    steps:
      # ── 1. Checkout source ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Build .exe with PyInstaller ────────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --noconsole `
            --onefile `
            --name GeminiAgentApp `
            --collect-all customtkinter `
            --collect-all google.genai `
            --hidden-import google.genai `
            --hidden-import google.genai.types `
            --hidden-import customtkinter `
            --hidden-import firebase_sync `
            --hidden-import conversation_store `
            main.py

      # ── 5. Verify the output exists ────────────────────────────────────
      - name: Verify build output
        run: |
          if (Test-Path "dist\GeminiAgentApp.exe") {
            $size = (Get-Item "dist\GeminiAgentApp.exe").length / 1MB
            Write-Host "✅ Build successful! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "❌ Build failed — GeminiAgentApp.exe not found!"
            exit 1
          }

      # ── 6. Upload as workflow artifact (always available) ──────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAgentApp-Windows
          path: dist/GeminiAgentApp.exe
          if-no-files-found: error
          retention-days: 30

      # ── 7. Upload to GitHub Release (only on release events) ───────────
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeminiAgentApp.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
